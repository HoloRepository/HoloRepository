<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Everything is loaded from inside the app bundle; no network access at all. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:">
  <title>HoloRepository 2027 Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* A small border so the views never touch the control bar or window edges. */
    body { padding: 10px; box-sizing: border-box; }
    #gl { display: block; width: 100%; height: 100%; outline: none; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <script src="boot.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
